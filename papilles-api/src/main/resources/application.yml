# ============================================================
#  PAPILLES API — application.yml
#  Placé dans : src/main/resources/application.yml
# ============================================================

spring:
  application:
    name: papilles-api

  # ─── Base de données ──────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:papilles}
    username: ${POSTGRES_USER:papilles}
    password: ${POSTGRES_PASSWORD:papilles_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gère le schéma, Hibernate valide uniquement
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ─── JWT (OAuth2 Resource Server) ─────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080}

# ─── Serveur ────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ─── Actuator ───────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── Config custom Papilles ───────────────────────────────
papilles:
  jwt:
    secret: ${JWT_SECRET:dev_secret_change_in_production_min_256_bits_long}
    expiration: ${JWT_EXPIRATION:3600000}        # 1h en ms
    refresh-expiration: ${JWT_REFRESH_EXP:604800000}  # 7j en ms
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

---
# ============================================================
#  PROFIL DEV — remplace les valeurs ci-dessus
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/seed      # ← V2 seed uniquement en dev

logging:
  level:
    com.papilles: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO

---
# ============================================================
#  PROFIL PROD — valeurs strictes pour le VPS
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  flyway:
    locations: classpath:db/migration   # seed exclu en prod

server:
  port: 8080

logging:
  level:
    root: WARN
    com.papilles: INFO