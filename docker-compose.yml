services:

  postgres:
    image: postgres:16-alpine
    container_name: papilles-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-papilles}
      POSTGRES_USER: ${POSTGRES_USER:-papilles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papilles_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papilles}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optionnel : interface web pour inspecter la DB ─────────
  adminer:
    image: adminer:latest
    container_name: papilles-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # démarré uniquement avec : docker compose --profile tools up

volumes:
  postgres_data: